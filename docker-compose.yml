services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports: ["6333:6333"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-service:
    build:
      context: .
      dockerfile: services/ml-service/Dockerfile
    environment:
      ML_BACKEND: ${ML_BACKEND:-hash}
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10

  vector-service:
    build:
      context: .
      dockerfile: services/vector-service/Dockerfile
    environment:
      ML_SERVICE_URL: http://ml-service:8001
      QDRANT_URL: http://qdrant:6333
      CORPUS_DIR: /corpus
    depends_on:
      qdrant: { condition: service_healthy }
      ml-service: { condition: service_healthy }
    ports: ["8002:8002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    environment:
      AI_MODE: ${AI_MODE:-offline}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DECOMPOSE_MODEL: ${DECOMPOSE_MODEL:-gpt-5.6-luna}
      SYNTHESIZE_MODEL: ${SYNTHESIZE_MODEL:-gpt-5.6-luna}
      TRAJECTORIES_DIR: /trajectories
    ports: ["8003:8003"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      ML_SERVICE_URL: http://ml-service:8001
      VECTOR_SERVICE_URL: http://vector-service:8002
      AI_SERVICE_URL: http://ai-service:8003
      REDIS_URL: redis://redis:6379/0
      SESSION_HMAC_SECRET: ${SESSION_HMAC_SECRET:-dev-secret-change-me}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-1800}
      RAW_LOGGING: ${RAW_LOGGING:-false}
      TELEMETRY_DIR: /telemetry
    depends_on:
      redis: { condition: service_healthy }
      ml-service: { condition: service_healthy }
      vector-service: { condition: service_healthy }
      ai-service: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes:
      - telemetry:/telemetry
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    ports: ["5173:5173"]
    depends_on:
      gateway: { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["80:80"]
    depends_on:
      gateway: { condition: service_healthy }
      web:
        condition: service_started

  eval-runner:
    build:
      context: .
      dockerfile: services/eval-runner/Dockerfile
    profiles: ["eval"]
    depends_on:
      gateway: { condition: service_healthy }
    volumes:
      - ./evaluation/results:/evaluation/results

volumes:
  telemetry:
