[project]
name = "prism-core"
version = "0.1.0"
description = "Pure, unit-tested logic shared by all Prelude services: schemas, controller policy, fusion, claim graph, hashchain."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prism_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
