# nginx edge — ADR-0006 / SECURITY.md T1. TLS termination, size caps, rate
# limiting before anything reaches gateway.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=prelude_rl:10m rate=20r/s;
    client_max_body_size 2m;

    upstream gateway_upstream {
        server gateway:8000;
    }

    upstream web_upstream {
        server web:5173;
    }

    server {
        listen 80;

        location /api/ {
            limit_req zone=prelude_rl burst=40 nodelay;
            proxy_pass http://gateway_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://web_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
